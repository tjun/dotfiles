project_doc_fallback_filenames = ["CLAUDE.md"]
approval_policy = "on-request"
model_reasoning_effort = "medium"
personality = "pragmatic"
sandbox_mode = "workspace-write"
model = "gpt-5.5"

[features]
hooks = true
remote_connections = true
terminal_resize_reflow = true
memories = false
external_migration = false
goals = true
prevent_idle_sleep = true

[[hooks.PreToolUse]]
matcher = "Bash"

[[hooks.PreToolUse.hooks]]
command = "bash ~/.claude/scripts/pre-bash-safety.sh"
type = "command"

[[hooks.PostToolUse]]
matcher = "Edit|Write"

[[hooks.PostToolUse.hooks]]
command = "bash ~/.claude/scripts/post-edit-format.sh"
type = "command"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."notion@openai-curated"]
enabled = true

[plugins."skill-creator@claude-plugins-official"]
enabled = true

[plugins."codex@openai-codex"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[shell_environment_policy]
# 実際の環境変数は codex/config.local.toml.example を config.local.toml にコピーして設定する。
# (TOML は同じテーブルを 2 回定義できないため、[shell_environment_policy.set] は
#  マシンごとの config.local.toml 側にまとめて置いている)
inherit = "core"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining"]
