# Linux 用の追加ツール。macOS では Homebrew (Brewfile) が同等のものを提供するため、
# ~/.config/mise/conf.d/linux.toml へ symlink して Linux でのみ読み込む。
[tools]
aqua = "latest"
bat = "latest"
difftastic = "latest"
direnv = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
go = "latest"
gojq = "latest"
hunk = "latest"
jq = "latest"
lefthook = "latest"
ripgrep = "latest"
sheldon = "latest"
shellcheck = "latest"
zoxide = "latest"
